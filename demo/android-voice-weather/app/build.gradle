plugins { id 'com.android.application' }
android {
    namespace 'cn.aihongbo.voiceweather'
    compileSdk 35
    ndkVersion '28.2.13676358'
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    defaultConfig { applicationId 'cn.aihongbo.voiceweather'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'; minSdk 26; targetSdk 35; versionCode 9; versionName '0.9.0'; ndk { abiFilters 'arm64-v8a' }; externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_STL=c++_shared' } } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { pickFirsts += ['**/libc++_shared.so'] } }
}
dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
