plugins { id 'com.android.application' }
android {
 namespace 'cn.aihongbo.diary'
 compileSdk 35
 defaultConfig { applicationId 'cn.aihongbo.diary'; minSdk 27; targetSdk 35; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'; versionCode 1; versionName '0.1.0'; ndk { abiFilters 'armeabi-v7a' } }
 sourceSets.main.assets.srcDirs = ['../app/src/main/assets']
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'com.alphacephei:vosk-android:0.3.75@aar'
 implementation 'net.java.dev.jna:jna:5.18.1@aar'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
